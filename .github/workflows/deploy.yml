name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check configuration
        id: config
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing secret:CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing secret:CLOUDFLARE_ACCOUNT_ID"
          [ -z "$NEXT_PUBLIC_SITE_URL" ] && missing="$missing variable:SITE_URL"
          if [ -n "$missing" ]; then
            echo "::warning::Deploy skipped. Add in Settings > Secrets and variables > Actions:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.config.outputs.ready == 'true'
        run: npm ci

      - name: Lint and type-check
        if: steps.config.outputs.ready == 'true'
        run: npm run lint && npx tsc --noEmit

      - name: Build and deploy
        if: steps.config.outputs.ready == 'true'
        run: npm run deploy
